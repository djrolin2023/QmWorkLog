{% extends "base.html" %}
{% block page %}users{% endblock %}
{% block title %}用户管理 - 乾明工作台账系统{% endblock %}
{% block content %}
<header class="page-head"><h1>用户管理</h1></header>
<div class="card">
    <div class="card-head">
        <h2>用户列表</h2>
        <button id="btnAddUser" class="btn btn-primary">新增用户</button>
    </div>
    <table class="table" id="userTable">
        <thead><tr><th>用户名</th><th>操作</th></tr></thead>
        <tbody id="userTbody"></tbody>
    </table>
</div>

<!-- 新增用户弹窗 -->
<div class="modal" id="userModal">
    <div class="modal-box">
        <div class="modal-head"><h3>新增用户</h3><button class="modal-close" onclick="App.closeModal('userModal')">×</button></div>
        <form id="userForm" class="form-grid">
            <label>用户名<input name="username" class="form-control" required></label>
            <label>密码<input type="password" name="password" class="form-control" required></label>
            <div class="form-actions"><button type="submit" class="btn btn-primary">创建</button></div>
        </form>
        <div id="userMsg" class="form-msg"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
{% endblock %}
