{% extends "base.html" %}
{% block page %}archive{% endblock %}
{% block title %}归档管理 - 乾明工作台账系统{% endblock %}
{% block content %}
<header class="page-head"><h1>归档管理</h1></header>
<div class="card">
    <div class="card-head">
        <h2>已归档文件</h2>
        <button id="btnCreateArchive" class="btn btn-primary">归档当前数据</button>
    </div>
    <table class="table" id="archiveTable">
        <thead><tr><th>类型</th><th>归档名称</th><th>大小</th><th>时间</th><th>操作</th></tr></thead>
        <tbody id="archiveTbody"></tbody>
    </table>
    <div id="archiveMsg" class="form-msg"></div>
</div>

<!-- 创建归档弹窗 -->
<div class="modal" id="archiveModal">
    <div class="modal-box">
        <div class="modal-head"><h3>归档当前数据</h3><button class="modal-close" onclick="App.closeModal('archiveModal')">×</button></div>
        <form id="archiveForm" class="form-grid">
            <label>类型
                <select name="type" id="arcType" class="form-control" required></select>
            </label>
            <label>年份<input name="year" id="arcYear" class="form-control" type="number" min="2000" max="2100" required></label>
            <label>月份（留空为归档整年）
                <select name="month" id="arcMonth" class="form-control">
                    <option value="">整年</option>
                    <option value="1">1月</option><option value="2">2月</option>
                    <option value="3">3月</option><option value="4">4月</option>
                    <option value="5">5月</option><option value="6">6月</option>
                    <option value="7">7月</option><option value="8">8月</option>
                    <option value="9">9月</option>
                    <option value="10">10月</option><option value="11">11月</option>
                    <option value="12">12月</option>
                </select>
            </label>
            <div class="form-actions form-actions-right">
                <button type="button" class="btn" onclick="App.closeModal('archiveModal')">取消</button>
                <button type="submit" class="btn btn-primary">归档</button>
            </div>
        </form>
        <div id="arcMsg" class="form-msg"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
{% endblock %}
