{% extends "base.html" %}
{% block page %}types{% endblock %}
{% block title %}台账管理 - 乾明工作台账系统{% endblock %}
{% block content %}
<header class="page-head"><h1>台账管理</h1></header>
<div class="card">
    <div class="card-head">
        <h2>台账类型</h2>
        <button id="btnAddType" class="btn btn-primary">新增类型</button>
    </div>
    <ul class="type-list" id="typeList"></ul>
</div>

<!-- 新增类型弹窗 -->
<div class="modal" id="typeModal">
    <div class="modal-box">
        <div class="modal-head"><h3>新增类型</h3><button class="modal-close" onclick="App.closeModal('typeModal')">×</button></div>
        <form id="typeForm" class="form-grid">
            <label>类型名称<input name="name" class="form-control" maxlength="20" required autocomplete="off"></label>
            <div class="form-actions form-actions-right">
                <button type="button" class="btn" onclick="App.closeModal('typeModal')">取消</button>
                <button type="submit" class="btn btn-primary">创建</button>
            </div>
        </form>
        <div id="typeMsg" class="form-msg"></div>
    </div>
</div>

<!-- 重命名弹窗 -->
<div class="modal" id="renameModal">
    <div class="modal-box">
        <div class="modal-head"><h3>重命名类型</h3><button class="modal-close" onclick="App.closeModal('renameModal')">×</button></div>
        <form id="renameForm" class="form-grid">
            <label>类型名称<input name="name" class="form-control" maxlength="20" required autocomplete="off"></label>
            <div class="form-actions form-actions-right">
                <button type="button" class="btn" onclick="App.closeModal('renameModal')">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
        <div id="renameMsg" class="form-msg"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
{% endblock %}
